<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Certificate — StegoTool Pro Learning Lab</title>
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="brand"><img src="assets/logo.png" alt=""> Learning Lab</a>
  <ul class="nav-links">
    <li><a href="index.html">All Lessons</a></li>
    <li><a href="advanced.html">Advanced</a></li>
    <li><a href="pricing.html">Pricing</a></li>
  </ul>
</nav>

<div class="container" style="padding-top: 40px; max-width: 720px;">
  <h1>🎓 Your Certificate</h1>
  <div id="cert-gate"></div>

  <div id="cert-content" style="display:none;">
    <div class="card">
      <label>Name on certificate: <input type="text" id="cert-name" value="A Learner" style="width:100%; margin-top: 8px;"></label>
    </div>
    <canvas id="cert-canvas" style="width:100%; border-radius: var(--radius); margin: 16px 0;"></canvas>
    <button class="btn btn-primary" id="cert-download">Download Certificate (PNG)</button>
  </div>
</div>

<footer>
  <p>Companion site for StegoTool Pro. Runs entirely in your browser.</p>
</footer>

<script src="js/lessons-data.js?v=2"></script>
<script src="js/progress.js?v=2"></script>
<script src="js/certificate.js?v=2"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const lessonId = params.get("lesson");
  const lesson = LESSONS[lessonId];
  const gate = document.getElementById("cert-gate");
  const content = document.getElementById("cert-content");

  if (!lesson || !isLessonComplete(lessonId)) {
    gate.innerHTML = `<div class="note note-warning">
      You haven't completed both Basic and Advanced levels of this lesson yet.
      <a href="index.html">Back to Learning Lab</a>
    </div>`;
  } else {
    content.style.display = "block";
    const canvas = document.getElementById("cert-canvas");
    const nameInput = document.getElementById("cert-name");

    function redraw() {
      renderCertificate(canvas, { name: nameInput.value, lessonTitle: lesson.title });
    }
    nameInput.addEventListener("input", redraw);
    redraw();

    document.getElementById("cert-download").addEventListener("click", () => {
      downloadCertificate(canvas, `stegotool-pro-${lessonId}-certificate.png`);
    });
  }
</script>
</body>
</html>
